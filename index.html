<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HC Tableside v8</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;font-size:13px;color:#e2e8f0}
:root{--bg:#0d1117;--s1:#141d2b;--s2:#1a2535;--b:#1e2d3d;--b2:#2d3f54;--cyan:#22d3ee;--t1:#e2e8f0;--t2:#94a3b8;--warn:#f59e0b;--danger:#ef4444;--ok:#10b981}

/* ══ SPLASH ══ */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .7s,transform .7s}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash svg{width:90px;height:112px;animation:logoIn .9s cubic-bezier(.34,1.2,.64,1) both}
#splash .mb{fill:var(--cyan);opacity:0;animation:fade .5s .4s forwards}
#splash .mh,#splash .ms{fill:#fff;opacity:0;animation:fade .4s .7s forwards}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(34,211,238,.12);opacity:0}
.r1{width:140px;height:140px;animation:ring 2s .5s ease forwards}
.r2{width:190px;height:190px;animation:ring 2s .8s ease forwards}
.r3{width:240px;height:240px;animation:ring 2s 1.1s ease forwards}

/* ══ LAYOUT ══ */
.vsw{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;flex-shrink:0}
.vb{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--b);background:var(--s1);color:var(--t2);white-space:nowrap;flex-shrink:0;transition:.15s}
.vb.on{background:rgba(34,211,238,.1);border-color:var(--cyan);color:var(--cyan)}

#app{height:calc(100vh - 36px);background:var(--bg);overflow:hidden;opacity:0;transition:opacity .5s .15s}
#app.vis{opacity:1}
.sc{display:none;flex-direction:column;height:100%;overflow:hidden}.sc.on{display:flex}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}

/* ══ CARD ══ */
.card{background:var(--s1);border:1px solid var(--b);border-radius:20px;margin:12px;padding:22px 18px 0;position:relative;animation:cardIn .4s cubic-bezier(.34,1.2,.64,1)}
.vh{text-align:center;margin-bottom:18px}.ib{width:70px;height:70px;border-radius:16px;background:linear-gradient(135deg,var(--cyan),#0891b2);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:28px;font-weight:800;color:var(--bg);animation:breathe 4s ease-in-out infinite}
.vn{font-size:20px;font-weight:700;letter-spacing:-.01em}.vt{color:var(--t1);font-size:14px;margin-top:3px;font-weight:500}

/* ══ TOP ICONS ══ */
.ci-wrap{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:10}
.ci{width:38px;height:38px;border-radius:10px;background:var(--s2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;position:relative}
.ci:hover{border-color:var(--b2);background:rgba(255,255,255,.03);transform:translateY(-2px)}.ci[title="Urgent Help"]:hover{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.12)}
.ci svg{width:18px;height:18px}
.ci-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:50%;background:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--bg);padding:0 4px;transition:.3s}
.ci-badge.ok{background:var(--ok)}.ci-badge.hide{display:none}
.hand{display:inline-flex;transform-origin:bottom center}.ci:hover .hand{animation:wave .5s ease infinite}

/* ══ SERVICE BUTTONS ══ */
.bg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.sb{background:var(--s2);border:1px solid rgba(34,211,238,.25);border-radius:14px;min-height:82px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 8px;transition:.15s}
.sb:hover{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.06);transform:translateY(-2px);box-shadow:0 4px 16px rgba(34,211,238,.08)}
.sb:active{transform:scale(.95)}.sb svg{stroke:var(--cyan);transition:.15s}.sb:hover svg{transform:scale(1.1)}
.sb-l{font-size:12px;font-weight:700;color:var(--t1);transition:.15s}
.sb-st{font-size:12px;display:flex;align-items:center;gap:5px;min-height:0;transition:.15s}.sb-st:empty{display:none}
.sb.pending{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.04)}
.sb.pending svg{stroke:#f59e0b}.sb.pending .sb-l,.sb.pending .sb-st{color:#f59e0b}
.sb.accepted{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.04)}
.sb.accepted svg{stroke:var(--ok)}.sb.accepted .sb-l,.sb.accepted .sb-st{color:var(--ok)}
.bell{transform-origin:top center}.sb:hover .bell{animation:jingle .6s ease}
.spinner{width:10px;height:10px;border:1.5px solid rgba(245,158,11,.3);border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.ck{width:12px;height:12px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ══ ESCALATION ══ */
.esc{margin:6px 0 12px}
.eb{width:100%;height:44px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:12px;font-weight:700;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.35);color:#f59e0b;transition:.15s}
.eb:active{transform:scale(.96)}.eb:hover{background:rgba(245,158,11,.12);transform:translateY(-1px)}
.eb svg{width:16px;height:16px;stroke:#f59e0b}

/* ══ SENTIMENT ══ */
.sent{padding:12px 18px 18px;margin:0 -18px;border-radius:0 0 16px 16px}
.sent.flash{animation:pulse .4s ease}
.sent-q{color:var(--t1);font-size:14px;text-align:center;margin-bottom:10px;font-weight:500}
.sr{display:flex;gap:9px;justify-content:center}
.fx{flex:1;max-width:130px;height:62px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.15s}
.fx:hover{transform:translateY(-2px)}.fx:active{transform:scale(.93)}
.fx-t{font-size:13px;font-weight:600}
.fx.pos{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.3)}.fx.pos .fx-t{color:var(--ok)}
.fx.neu{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.3)}.fx.neu .fx-t{color:#f59e0b}
.fx.neg{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.3)}.fx.neg .fx-t{color:var(--danger)}

/* ══ OUTCOMES ══ */
.ob{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 24px 24px;text-align:center;overflow-y:auto}
.of{margin-bottom:18px;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}.of svg{animation:float 3s ease-in-out infinite}
.ot{font-size:20px;font-weight:700;margin-bottom:8px;animation:up .4s .2s both}
.os{font-size:14px;line-height:1.6;max-width:300px;animation:up .4s .3s both;font-weight:500;color:var(--t1);margin-left:auto;margin-right:auto}
.ac{background:var(--s2);border:1px solid var(--b);border-radius:14px;padding:18px;margin-top:22px;width:100%;max-width:320px;animation:up .5s .4s both;text-align:left}
.ac-t{font-size:16px;font-weight:700;margin-bottom:6px}.ac-s{color:var(--t1);font-size:14px;margin-bottom:14px}
.ac-ta{width:100%;background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:12px;font-size:13px;font-family:inherit;resize:none;height:76px;outline:none;margin-bottom:12px;color:var(--t1)}
.ac-ta:focus{border-color:#f59e0b}.ac-ta::placeholder{color:var(--t2)}
.ac-btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.ac-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.stars{display:flex;gap:2px}.stars svg{width:15px;height:15px;animation:none!important}
.done-btn{margin-top:18px;padding:12px 44px;background:transparent;border:1px solid var(--b);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;animation:up .4s .5s both;transition:.15s;color:var(--t1)}
.done-btn:hover{background:var(--s2)}.done-btn{display:none}
.tst{margin-top:20px;width:100%;max-width:320px}
.tsr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(30,45,61,.4)}
.tsr:last-child{border:none}
.td{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:.3s}
.td.done{background:var(--ok)}.td.wait{background:var(--b2)}.td.prog{background:#f59e0b;animation:pulse2 1.2s ease infinite}
.tl{font-size:14px;font-weight:600;flex:1;color:var(--t1)}.tt{font-size:12px;font-weight:600;font-family:'SF Mono',Monaco,monospace;transition:.3s}
.tt.done{color:var(--ok)}.tt.wait{color:var(--t2)}.tt.prog{color:#f59e0b}
.rbtns{display:flex;gap:10px;margin-top:14px;width:100%;max-width:300px;animation:up .4s .4s both}
.rbtns button{flex:1;padding:13px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}.rbtns button:hover{transform:translateY(-2px);filter:brightness(1.08)}.rbtns button:last-child:hover{background:rgba(56,138,221,.08)!important;border-color:rgba(56,138,221,.35)!important;color:#85B7EB!important;filter:none}

/* ══ REQUEST LIST ══ */
.rq{background:var(--s1);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:10px;transition:.3s}
.rq.st-pending{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.04)}
.rq.st-accepted{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.04)}
.rq.st-done{opacity:.45}.rq-x{width:24px;height:24px;border-radius:50%;background:rgba(148,163,184,.08);border:none;color:var(--t2);font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}.rq-x:hover{background:rgba(148,163,184,.15);color:var(--t1)}.rq.st-done .rq-x{display:flex}
.rq-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rq-n{font-size:16px;font-weight:700}.rq-t{font-size:12px;color:var(--t2);font-family:'SF Mono',Monaco,monospace}
.rq-track{display:flex;align-items:center;gap:0;margin-bottom:10px}
.rq-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--b2);background:transparent;flex-shrink:0;transition:.3s}
.rq-dot.on{border-color:var(--ok);background:var(--ok)}
.rq-dot.active{border-color:#f59e0b;background:#f59e0b;animation:pulse2 1.2s ease infinite}
.rq-line{width:28px;height:2px;background:var(--b);flex-shrink:0;transition:.3s}
.rq-line.on{background:var(--ok)}.rq-line.active{background:rgba(245,158,11,.4)}
.rq-d{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.rq-staff{font-weight:600;color:var(--ok)}
.rq-el{font-size:12px;color:var(--t2);font-family:'SF Mono',Monaco,monospace;margin-left:auto}

/* ══ ALLERGY ══ */
.bk{background:none;border:none;color:var(--t1);font-size:13px;font-weight:600;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:6px;flex-shrink:0;transition:.15s;border-radius:8px}.bk:hover{background:rgba(255,255,255,.04)}
.pt{font-size:20px;font-weight:700;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.ps{font-size:14px;padding:0 18px;margin-bottom:20px;color:var(--t1);font-weight:500;text-align:center}
.sec{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;padding:0 18px}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px;margin-bottom:16px}
.chip{padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;border:1px solid var(--b);background:var(--s1);color:var(--t1)}
.chip.on{background:rgba(245,158,11,.12);border-color:#f59e0b;color:#f59e0b}
.chip.added{background:rgba(16,185,129,.1);border-color:var(--ok);color:var(--ok);cursor:default}
.chip:hover{border-color:var(--b2);transform:translateY(-1px)}.chip:active{transform:scale(.94)}
.srw{position:relative;padding:0 18px;margin-bottom:16px}
.srb{width:100%;background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:12px 14px 12px 38px;font-size:14px;font-family:inherit;outline:none;color:var(--t1);transition:.15s}
.srb:focus{border-color:#f59e0b}.srb::placeholder{color:var(--t2)}
.sri{position:absolute;left:30px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--t2)}
.srl{position:absolute;left:18px;right:18px;top:100%;background:var(--s1);border:1px solid var(--b);border-radius:0 0 10px 10px;max-height:200px;overflow-y:auto;z-index:50;display:none}
.srl.open{display:block}
.srl-i{padding:11px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:.1s;border-bottom:1px solid rgba(30,45,61,.3)}
.srl-i:last-child{border:none}.srl-i:hover{background:rgba(245,158,11,.06)}
.srl-n{font-weight:600}.srl-c{font-size:12px;color:var(--t2);padding:2px 8px;border-radius:99px;background:rgba(245,158,11,.08)}
.srl-new{padding:11px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#f59e0b;font-weight:600}
.srl-new:hover{background:rgba(245,158,11,.06)}
.cfg{margin:0 18px 16px;background:var(--s2);border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:18px}
.cfg-t{color:#f59e0b;font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cfg-s{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rk{padding:14px 12px 14px 18px;border-radius:10px;border:1px solid var(--b);background:var(--s1);cursor:pointer;text-align:left;transition:.15s;position:relative;overflow:hidden}
.rk:hover{border-color:var(--b2);transform:translateY(-1px)}.rk:active{transform:scale(.96)}
.rk[data-v=unsure].on{border-color:#94a3b8;background:rgba(148,163,184,.06)}
.rk[data-v=discomfort].on{border-color:#22d3ee;background:rgba(34,211,238,.06)}
.rk[data-v=severe].on{border-color:#f59e0b;background:rgba(245,158,11,.08)}
.rk[data-v=anaphylaxis].on{border-color:#ef4444;background:rgba(239,68,68,.08)}
.rk-n{font-size:13px;font-weight:700}.rk-d{color:var(--t2);font-size:12px;margin-top:3px}
.ccr{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--s1);border:1px solid var(--b);border-radius:10px;cursor:pointer;margin-bottom:14px;transition:.15s}
.ccr:hover{border-color:var(--b2)}.ccr.on{border-color:#f59e0b;background:rgba(245,158,11,.06)}
.cck{width:22px;height:22px;border-radius:6px;border:2px solid var(--b2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.ccr.on .cck{background:#f59e0b;border-color:#f59e0b}
.cfg-a{padding:11px 28px;background:#f59e0b;border:none;border-radius:10px;color:var(--bg);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.cfg-a:hover{filter:brightness(1.08);transform:translateY(-1px)}.cfg-a:disabled{opacity:.3;cursor:not-allowed;transform:none;filter:none}
.dl{margin:0 18px 16px}
.di{display:flex;align-items:center;gap:10px;padding:13px 14px 13px 18px;background:var(--s2);border:1px solid rgba(245,158,11,.2);border-left:3px solid #f59e0b;border-radius:10px;margin-bottom:7px;animation:up .2s ease}
.di-n{font-size:14px;font-weight:700;flex:1}
.di-b{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.di-xc{padding:3px 8px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#f59e0b}
.di-rm{width:24px;height:24px;border-radius:50%;background:rgba(239,68,68,.1);border:none;color:var(--danger);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nta{width:calc(100% - 36px);margin:0 18px 16px;background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:12px;font-size:13px;font-family:inherit;resize:none;height:64px;outline:none;color:var(--t1)}
.nta:focus{border-color:#f59e0b}.nta::placeholder{color:var(--t2)}
.sbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 18px;padding:14px;background:#f59e0b;border:none;border-radius:12px;color:var(--bg);font-size:14px;font-weight:700;cursor:pointer;width:calc(100% - 36px);font-family:inherit}
.hint{color:#f59e0b;font-size:12px;text-align:center;padding:6px;animation:up .2s}
.wi{width:64px;height:64px;border-radius:50%;background:rgba(245,158,11,.08);border:2px solid #f59e0b;display:flex;align-items:center;justify-content:center;margin-bottom:16px;animation:glow 2s ease-in-out infinite}

/* ══ SHEET ══ */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(5,11,20,.82);display:flex;align-items:flex-end;animation:fadeIn .2s}
.sheet{background:var(--s1);border-top:1px solid var(--b);border-radius:20px 20px 0 0;width:100%;padding:18px;animation:slideUp .3s cubic-bezier(.34,1.2,.64,1)}
.sheet-bar{width:36px;height:4px;background:var(--b2);border-radius:4px;margin:0 auto 16px}
.hld{position:relative;overflow:hidden;width:100%;padding:13px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center;gap:8px}
.alert-icon{width:52px;height:52px;border-radius:50%;background:rgba(239,68,68,.1);border:2px solid var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:alertPulse 2s ease-in-out infinite}@keyframes alertPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}.hld-progress{position:absolute;bottom:-6px;left:0;right:0;height:4px;background:rgba(239,68,68,.15);border-radius:4px;overflow:hidden}.hld-bar{height:100%;width:0;background:var(--danger);border-radius:4px}.hld-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.18);pointer-events:none}

/* ══ MISC ══ */
.pb{width:100%;padding:14px;background:#f59e0b;border:none;border-radius:12px;color:var(--bg);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;transition:.15s}.pb:hover{filter:brightness(1.08);transform:translateY(-1px)}
.txt-link{background:none;border:none;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s;padding:6px 12px;border-radius:8px}.txt-link:hover{color:var(--t1);background:rgba(255,255,255,.04)}button:focus-visible,.sb:focus-visible,.chip:focus-visible,.fx:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}input:focus-visible,textarea:focus-visible{outline:2px solid #f59e0b;outline-offset:1px}.close-x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--s2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;z-index:10}.close-x:hover{background:rgba(255,255,255,.06);border-color:var(--b2);transform:scale(1.08)}.close-x svg{width:16px;height:16px;stroke:var(--t2);stroke-width:1.75;transition:.15s}.close-x:hover svg{stroke:var(--t1)}.footer{display:none;padding:8px;text-align:center;color:var(--t2);font-size:12px;flex-shrink:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(16,185,129,.12);border:1px solid var(--ok);border-radius:10px;padding:10px 20px;color:var(--ok);font-size:13px;font-weight:600;pointer-events:none;animation:toastIn .25s;backdrop-filter:blur(8px)}

/* ══ ANIMATIONS ══ */
@keyframes fade{to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

// Subscribe to kitchen acknowledgment for this declaration
function subscribeToAck(declId) {
  sb.channel('ack-'+declId)
    .on('postgres_changes', {
      event: 'UPDATE',
      schema: 'public',
      table: 'allergen_declarations',
      filter: 'id=eq.'+declId
    }, function(payload) {
      var d = payload.new;
      if (d.kitchen_ack_at || d.server_ack_at) {
        // Kitchen or server acknowledged — transition guest to profile
        go('alack');
      }
    })
    .subscribe();
}

function subscribeToAckFallback(sessId) {
  sb.channel('ack-fb-'+sessId)
    .on('postgres_changes', {
      event: 'UPDATE',
      schema: 'public',
      table: 'allergen_declarations',
      filter: 'guest_session_id=eq.'+sessId
    }, function(payload) {
      var d = payload.new;
      if (d.kitchen_ack_at || d.server_ack_at) {
        go('alack');
      }
    })

}

function svcTap(idx,label){
  var cats=['check_please','water','waiter','clear'];
  insertRequest(cats[idx]);
  var btn=document.getElementById('sb'+idx);
  if(btn){btn.style.transform='scale(.93)';setTimeout(function(){btn.style.transform=''},150)}
  addRequest(label,idx);
  toast(label+' requested');
}
function addRequest(label,idx){
  rid++;
  var r={id:rid,label:label,status:'pending',at:Date.now(),ackAt:null,resAt:null,staff:null,btn:idx};
  reqs.push(r);
  
  setBtnState(idx,'pending');
  // Timer on button
  var myId=rid;
  var tmr=setInterval(function(){
    var q=reqs.find(function(x){return x.id===myId});
    if(!q||q.status==='completed'||q.status==='accepted'){clearInterval(tmr);return}
    var sec=Math.floor((Date.now()-q.at)/1000);
    var ss=document.getElementById('ss'+idx);
    if(ss)ss.innerHTML='<div class="spinner"></div>Requested · '+fmtTime(sec);
  },1000);
  // Simulate accept (3-7s)
  setTimeout(function(){
    var q=reqs.find(function(x){return x.id===myId});
    if(q){q.status='accepted';q.ackAt=Date.now();q.staff='Maria S.';setBtnState(idx,'accepted',q)}
  },3000+Math.random()*4000);
  // Simulate complete (8-15s)
  setTimeout(function(){
    var q=reqs.find(function(x){return x.id===myId});
    if(q){q.status='completed';q.resAt=Date.now();setBtnState(idx,'default');var cId=q.id;setTimeout(function(){reqs=reqs.filter(function(r){return r.id!==cId})},300000)}
  },8000+Math.random()*7000);
}
function setBtnState(idx,state,req){
  var btn=document.getElementById('sb'+idx);
  var ss=document.getElementById('ss'+idx);
  if(!btn||!ss)return;
  btn.classList.remove('pending','accepted');
  if(state==='pending'){btn.classList.add('pending');ss.innerHTML='<div class="spinner"></div>Requested'}
  else if(state==='accepted'){btn.classList.add('accepted');ss.innerHTML='<div class="ck">'+IC.chk7+'</div>Accepted · On the Way'}
  else{ss.innerHTML='';btn.style.transition='all .5s';setTimeout(function(){btn.style.transition=''},600)}
}

function fmtTime(sec){var m=Math.floor(sec/60);var s=sec%60;return m>0?m+':'+String(s).padStart(2,'0'):s+'s'}

  setTimeout(function(){var d=document.getElementById('d2'+type);var t=document.getElementById('t2'+type);if(d){d.className='td done'}if(t){t.className='tt done';t.textContent=fmtClock(new Date())}var d3=document.getElementById('d3'+type);if(d3)d3.className='td prog';var t3=document.getElementById('t3'+type);if(t3){t3.className='tt prog';t3.textContent='in progress…'}},aDel);
  setTimeout(function(){var d=document.getElementById('d3'+type);var t=document.getElementById('t3'+type);if(d)d.className='td done';if(t){t.className='tt done';t.textContent=fmtClock(new Date())}},rDel);
}

  +'<div class="rg">'+RISKS.map(function(r){return '<div class="rk'+(curRisk===r.v?' on':'')+'" data-v="'+r.v+'" onclick="setRisk(\''+r.v+'\')">'+'<div style="position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:'+r.c+'"></div>'+'<div style="display:flex;justify-content:space-between;align-items:center"><div><div class="rk-n">'+r.l+'</div><div class="rk-d">'+r.d+'</div></div><div style="color:'+r.c+';font-size:12px;letter-spacing:2px">'+r.dots+'</div></div></div>'}).join('')+'</div>'
  +'<div class="ccr'+(curXC?' on':'')+'" onclick="toggleXC()"><div class="cck">'+(curXC?'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 3 5 9 2 6"/></svg>':'')+'</div><div><div style="font-size:13px;font-weight:700">Avoid cross-contact</div><div style="color:var(--t2);font-size:12px;margin-top:2px">Separate surfaces, utensils, and prep.</div></div></div>'
  +'<div style="display:flex;justify-content:flex-end"><button class="cfg-a"'+(curRisk?'':' disabled')+' onclick="addToDecl()">Add</button></div></div>';
}
function setRisk(v){curRisk=v;buildConfig(true)}
function toggleXC(){curXC=!curXC;buildConfig(true)}
function addToDecl(){if(!curAllergen||!curRisk)return;decl.push({name:curAllergen,risk:curRisk,xc:curXC});curAllergen=null;document.getElementById('cfgPanel').innerHTML='';buildChips();buildDecl();
if(venueId)loadVenueData();toast('Added ✓')}
function removeDecl(i){decl.splice(i,1);buildChips();buildDecl()}
function saveNameAndContinue(){
  var fn=document.getElementById('fnameInput');
  var ln=document.getElementById('lnameInput');
  var first=fn?fn.value.trim():'';
  var last=ln?ln.value.trim():'';
  if(!first){
    fn.style.borderColor='var(--danger)';
    fn.setAttribute('placeholder','First Name Required');
    fn.style.setProperty('--ph-color','var(--danger)');
    setTimeout(function(){fn.style.borderColor='var(--b)';fn.setAttribute('placeholder','First Name')},2000);
    return;
  }
  guestName=first+(last?' '+last:'');
  go('allergy');
}



// Allow Enter key to proceed
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.target.id==='fnameInput'||e.target.id==='lnameInput')){
    saveNameAndContinue();
  }
});

function trySubmit(){if(!decl.length){var sb=document.getElementById('submitBtn');sb.style.animation='shake .4s ease';setTimeout(function(){sb.style.animation=''},600);if(!document.getElementById('hintMsg')){var h=document.createElement('div');h.id='hintMsg';h.className='hint';h.textContent='Select at least one allergen above';sb.parentNode.insertBefore(h,sb)}return}document.getElementById('alwaitTitle').textContent=decl.length===1?'Allergy Sent':'Allergies Sent';go('alwait');setTimeout(function(){var ws=document.getElementById('s-alwait');if(ws&&ws.classList.contains('on')){go('alack')}},60000)}

// Search
function doSearch(){var v=document.getElementById('searchIn').value.trim().toLowerCase();var sr=document.getElementById('searchRes');if(v.length<1){sr.classList.remove('open');return}var added=decl.map(function(d){return d.name.toLowerCase()});var matches=ADB.filter(function(a){return a.n.toLowerCase().indexOf(v)>-1&&!added.includes(a.n.toLowerCase())}).slice(0,6);var html='';matches.forEach(function(m){html+='<div class="srl-i" onclick="pickSearch(\''+m.n+'\')"><span class="srl-n">'+m.n+'</span><span class="srl-c">'+m.c+'</span></div>'});var exact=ADB.some(function(a){return a.n.toLowerCase()===v});if(!exact&&v.length>1){var cap=v.charAt(0).toUpperCase()+v.slice(1);html+='<div class="srl-new" onclick="addCustom(\''+cap+'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add \u201c'+cap+'\u201d as custom</div>'}if(!html)html='<div style="padding:11px 14px;font-size:13px;color:var(--t2)">No matches</div>';sr.innerHTML=html;sr.classList.add('open')}
function pickSearch(name){document.getElementById('searchIn').value='';closeSearch();if(PRESETS.includes(name)){selectAllergen(name);return}curAllergen=name;curRisk=null;curXC=false;buildConfig()}
function addCustom(name){if(decl.some(function(d){return d.name.toLowerCase()===name.toLowerCase()})){document.getElementById('searchIn').value='';closeSearch();return}document.getElementById('searchIn').value='';closeSearch();curAllergen=name;curRisk=null;curXC=false;buildConfig();toast('"'+name+'" — will be reviewed for database')}
function closeSearch(){document.getElementById('searchRes').classList.remove('open')}

// ══════════════════════════════════════════════════════════════
// URGENT HELP SHEET
// ══════════════════════════════════════════════════════════════
var holdRAF=null,holdStart=0;

function startHold(){holdStart=Date.now();var f=document.getElementById('holdFill');var bar=document.getElementById('holdBar');var st=document.getElementById('holdStatus');if(!f)return;f.style.transition='none';f.style.width='0%';if(bar){bar.style.transition='none';bar.style.width='0%'}var phase=0;(function tick(){if(!holdStart)return;var p=Math.min((Date.now()-holdStart)/3000,1);f.style.width=(p*100)+'%';if(bar)bar.style.width=(p*100)+'%';if(st){if(p>=0.5&&phase<2){phase=2;st.textContent='Alerting staff\u2026';st.style.color='var(--danger)'}else if(p>=0.15&&phase<1){phase=1;st.textContent='Keep holding\u2026';st.style.color='var(--t1)'}}if(p>=1){holdStart=0;if(st){st.textContent='Help Is On the Way';st.style.color='var(--danger)'}setTimeout(function(){go('main');insertUrgent();toast('Help is on the way')},1200);return}holdRAF=requestAnimationFrame(tick)})()}
function endHold(){if(holdRAF)cancelAnimationFrame(holdRAF);holdStart=0;var f=document.getElementById('holdFill');if(f){f.style.transition='width .2s';f.style.width='0%'}var bar=document.getElementById('holdBar');if(bar){bar.style.transition='width .2s';bar.style.width='0%'}var st=document.getElementById('holdStatus');if(st){st.textContent='Manager and nearest staff alerted instantly.';st.style.color='var(--t2)'}}

// ── TOAST ──

function toast(m){var e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2400)}

// ── INIT ──
buildChips();buildDecl();
if(venueId)loadVenueData();
</script>
</body>
